# Jarvis v1 configuration. Restart Jarvis after editing.

[audio]
sample_rate = 16000          # openWakeWord and Whisper both expect 16 kHz mono
input_device = ""            # "" = Windows default mic, or part of the device name (see: python -m jarvis --list-devices)

[wakeword]
model = "hey_jarvis"         # the pretrained model listens for "Jarvis": "Hi Jarvis" scores 1.00 (3 Oct test)
threshold = 0.5              # raise (e.g. 0.7) if it triggers by itself, lower if it misses you
cooldown_seconds = 2.0

[listen]
max_seconds = 15.0           # hard cap on one command (it still stops as soon as you pause)
silence_seconds = 0.8        # stop recording after this much silence once you've started talking
no_speech_timeout = 4.0      # give up if you say nothing after the wake word
vad_aggressiveness = 2       # 0-3, higher = more strict about what counts as speech
followup_seconds = 5         # after answering, keep listening this long without "Hi Jarvis" (0 = off)

[ai]
profile = "Chrome profiles: main = ABHRA, AI = Abhra (second), backup = Abhra Chakraborty, Large Language, Miscellaneous, Work. Browsers: Chrome, Brave. Studies on PW (Physics Wallah, pw.live; batch VICTORY 2027; Khazana = recorded classes). Plays chess on chess.com. Headphones: Rockerz 480. Java in BlueJ, C++ in VS Code. Apps include Claude, WhatsApp, eFootball, Notepad."
brain = "new"  # "new" = the rewrite's brain (jarvis/llm/brain2.py): switched on in the Phase 1 live check
cloudflare_account_id = "ad4ea1665cd1721c770d2d9f321d459e"  # not a secret (names the account); the token is in .env
# v3 (26 Sep): Groq + Gemini only. See docs/ai-provider-report.md.
# Gemini Flash-Lite: anything that needs the screen, questions about live facts, and the fallback.
# 3.5 Flash-Lite: 16/16 commands, 10/12 screen clicks; 3.1 Flash-Lite: never hung in tests.
model = "gemini-3.5-flash-lite"
fallback_models = ["gemini-3.1-flash-lite"]
# Groq (~1 s): commands and questions. Its free limit is per model (8k tokens/min, 200k/day), so it
# moves down this list when one is rate-limited. Its models can't see: screen steps go to Gemini.
groq_models = ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
# Which AI goes first for each kind of request (router.py decides the kind). Defaults:
# screen/live -> Gemini first; chat/action/files -> Groq first. To change, add a section at the end of
# this file, e.g.  [ai.routing]  then  action = ["gemini", "groq"]
# The agent core (jarvis/agent, 29 Sep): one AI call plans the whole task, then every step is done and CHECKED
# in code (no screenshots), with one repair and then one clear question. Anything that must see pictures still
# goes to the old loop below. false = the old tool-by-tool loop only.
agent_mode = true
max_steps = 14               # max AI round-trips per request (look -> click -> look ... needs several)
history_minutes = 5          # forget the conversation after this much silence
history_turns = 10
timeout_seconds = 10         # per AI request (normal is ~2s, ~4s with a screenshot); then the next model/Groq takes over
slow_backoff_seconds = 180   # after Gemini stalls, ask Groq first for this long, then give Gemini another chance
# The newest Lite models often hang (4-6 of 8 requests in a test). If the main model hasn't answered after
# hedge_after_seconds, the request also goes to hedge_model (older, never hung) and the first answer wins.
# 26 Sep session: at 2.5 s a backup copy went out on 18 of 29 requests but won only once (normal answers
# with a screenshot take 3-5 s), wasting free quota. 5 s still catches real hangs.
hedge_after_seconds = 5
hedge_model = "gemini-3.1-flash-lite"

[stt]
model = "base.en"            # on the CPU: the fallback, and the whole thing if there's no NVIDIA GPU
compute_type = "int8"
# The better model on the GPU, but only during a conversation: it loads on "Hi Jarvis" and its process
# exits after gpu_idle_seconds of quiet, so the GPU is completely free while Jarvis just waits (user's rule).
# Measured 30 Sep (tools/stt_eval.py, 112 clips incl. the user's misheard sentences and music): small.en GPU 5.9% clean,
# 8.9% with ducked music, 0.26 s, 357 MB, loads in ~3.5 s; large-v3-turbo 8.3% / 11.9%, 0.69 s, 1 GB, loads in ~7 s
# (better only with loud music, which Jarvis now ducks); base.en CPU 9.8%, 0.68 s. Remove gpu_model to use the CPU only.
# Hearing in the cloud first (30 Sep): Groq's Whisper large-v3, free (2,000 a day), 0.34 s, the GPU never on.
# If it's down or slow, the CPU model takes that sentence and the GPU one is used for the next minute.
cloud_model = "whisper-large-v3"
cloud_timeout = 3.0
gpu_model = "small.en"
gpu_idle_seconds = 0         # 0 = one sentence: the GPU loads as you start speaking and exits right after (user, 30 Sep)
gpu_load_wait = 4.0          # a finished sentence waits this long for the GPU model (loads in ~3.5 s) before the CPU takes it

[tts]
engine = "edge"              # "edge" (natural, needs internet) / "offline" (pyttsx3) / "beep"
voice = "en-GB-RyanNeural"   # try en-US-GuyNeural, en-IN-PrabhatNeural, en-US-AriaNeural
rate = "+5%"
wake_reply = "Yes, my lord?"  # said when it hears "Hi Jarvis" ("" = soft chime instead). Stopping always plays a soft chime.

[volume]
step = 10                    # percent for "volume up" / "volume down"

# Spoken nickname -> Chrome profile folder. Three profiles are all named "Abhra" and speech has no
# capital letters, so say these instead: "open my main profile", "switch to the AI profile".
# Folders: see the status page or `chrome://version` ("Profile Path") inside each profile.
[chrome_profiles]
main = "Default"          # ABHRA (abhrachakraborty21@...)
personal = "Default"
ai = "Profile 1"          # Abhra (gptclaudeusage@...)
backup = "Profile 4"      # Abhra Chakraborty (abhrachakraborty5b@...)

# Spoken name -> what to launch. Anything not listed here is looked up
# in your Start Menu automatically, so "open spotify" works without an entry.
[apps]
notepad = "notepad.exe"
calculator = "calc.exe"
chrome = "chrome"
edge = "msedge"
browser = "msedge"
"file explorer" = "explorer.exe"
explorer = "explorer.exe"
"command prompt" = "cmd.exe"
terminal = "wt.exe"
"task manager" = "taskmgr.exe"
settings = "ms-settings:"
paint = "mspaint.exe"
"vs code" = "code"
"visual studio code" = "code"
# BlueJ (Java) is a portable install in OneDrive Documents, not in the Start menu (30 Sep); speech hears it as
# "Blue Jay" / "BlueJig".
bluej = 'C:\Users\abhra\OneDrive\Documents\BlueJ\bluej.exe'
"blue j" = 'C:\Users\abhra\OneDrive\Documents\BlueJ\bluej.exe'
"blue jay" = 'C:\Users\abhra\OneDrive\Documents\BlueJ\bluej.exe'
bluejig = 'C:\Users\abhra\OneDrive\Documents\BlueJ\bluej.exe'
# Speech recognition often hears "Claude" as "Cloud"; both open the Claude desktop app.
claude = "shell:AppsFolder\\Claude_pzs8sxrjxfjjc!Claude"
cloud = "shell:AppsFolder\\Claude_pzs8sxrjxfjjc!Claude"
